# catalog/skills.yaml — single source of truth for cross-skill relationships
#
# This catalog is the authoritative registry for routing. It holds every
# relationship that cannot be derived from a single SKILL.md in isolation:
# role, priority, risk_floor, composition, overlap and cost. The skill-router
# is generated from / guided by this file; scripts/validate.py detects drift
# between this catalog and the filesystem.
#
# Roles (from plan.md § 6.2):
#   generator     — produces hypotheses to be confirmed elsewhere
#   investigator  — maps and probes a specific class of mechanism
#   verifier      — confirms or refutes a specific class of evidence
#   reviewer      — evaluates against a normative standard
#   researcher    — discovers and synthesizes external knowledge
#   router        — dispatches work to other skills
#
# Priority:  low | medium | high   (matches SKILL.md frontmatter enum)
# Risk floor: trivial | medium | high | critical — the minimum risk level at which
#             the skill becomes relevant (matches the skill-budget risk scale).
# Lifecycle:  experimental | stable | deprecated

- name: adversarial-review
  category: audit
  role: generator
  priority: high
  risk_floor: medium
  triggers:
