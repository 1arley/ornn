    - "test a flow adversarially"
    - "find bugs by attacking assumptions"
    - "review before shipping"
    - "what could a malicious user do"
  requires_signals:
    - adversarial-intent
  composes_with:
    - business-logic-audit
    - race-condition-hunter
    - idempotency-audit
    - authorization-audit
    - api-abuse-audit
  overlaps_with:
    - user-flow-audit
    - edge-case-hunter
  reasoning_cost: low
  research_cost: low
  lifecycle: stable

