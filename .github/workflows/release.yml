name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  gate:
    name: release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validator
        run: python3 scripts/validate.py
      - name: Routing gates
        run: python3 scripts/eval.py route --router v2 --check
      - name: Findings fixtures
        run: python3 scripts/eval.py findings-fixtures
      - name: CLI tests
        run: node --test test/prompts.test.js test/cli.test.js test/universal-installer.test.js
      - name: Unit tests
        run: python3 -m unittest discover -s test -p 'test_*.py'
      - name: npm pack --dry-run
        run: npm pack --dry-run
      - name: Verify package version matches tag
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "package.json version $PKG != tag $TAG" >&2
            exit 1
          fi

  publish:
    name: publish to npm
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish
        run: npm publish --provenance
