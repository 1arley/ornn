name: auto-bump

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    name: version bump & tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine bump type from commits
        id: bump
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${LAST_TAG}..HEAD"
          fi

          COMMITS=$(git log "$RANGE" --pretty=format:"%s" 2>/dev/null || echo "")

          if [ -z "$COMMITS" ]; then
            echo "type=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MAJOR=$(echo "$COMMITS" | grep -ciE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE' || true)
          MINOR=$(echo "$COMMITS" | grep -ciE '^feat(\(.+\))?:' || true)
          PATCH=$(echo "$COMMITS" | grep -ciE '^fix(\(.+\))?:|^chore(\(.+\))?:|^docs(\(.+\))?:|^refactor(\(.+\))?:|^perf(\(.+\))?:|^test(\(.+\))?:|^ci(\(.+\))?:|^build(\(.+\))?' || true)

          if [ "$MAJOR" -gt 0 ]; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif [ "$MINOR" -gt 0 ]; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          elif [ "$PATCH" -gt 0 ]; then
            echo "type=patch" >> "$GITHUB_OUTPUT"
          else
            echo "type=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version
        if: steps.bump.outputs.type != 'none'
        run: |
          BUMP="${{ steps.bump.outputs.type }}"
          echo "Bumping version: $BUMP"

          npm version "$BUMP" --no-git-tag-version

          NEW_VER=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$NEW_VER" >> "$GITHUB_ENV"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add package.json
          git commit -m "chore(release): v${NEW_VER} [skip ci]"
          git tag "v${NEW_VER}"
          git push origin main "v${NEW_VER}"
