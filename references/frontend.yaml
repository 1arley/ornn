- name: Motion
  url: https://motion.dev/
  type: implementation
  category: frontend
  authority: established
  last_verified: 2026-09-01
  status: active
  use_when:
    - implementing the official React animation system via motion/react
    - researching layout and shared-layout transitions, enter/exit, gestures, and interruption
    - implementing reduced-motion policy and performance-conscious animation primitives
  avoid_when:
    - no-animation task
    - when reduced-motion accessibility is the sole concern
  search_queries:
    - "motion dev react animation"
    - "motion react variants"
    - "framer motion 2"

