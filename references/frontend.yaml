    - "shoogle frontend components"
    - "shoogle UI library discovery"
    - "shoogle react components"

# ---------------------------------------------------------------------------
# Component sourcing libraries. `type: implementation` — source components from
# these, then ADAPT to the design system. Never blind-copy (ver references/
# reference-authoring.md: "referência, não cópia" e AGENTS.md §1).
# ---------------------------------------------------------------------------

- name: Magic UI
  url: https://magicui.design/
  type: implementation
  category: frontend
  authority: community
  last_verified: 2026-09-01
  status: active
  use_when:
    - sourcing animated, shadcn-style React/Tailwind components
    - implementing copy-paste UI blocks to adapt to a design system
    - building marketing/section components with motion
  avoid_when:
    - needing framework-agnostic (Vue/Svelte) primitives
    - needing application behavior or accessibility primitives rather than marketing visuals
    - when only review of existing UI, not creation
  search_queries:
    - "magic ui components"
    - "magic ui shadcn component"
    - "magic ui animated component"

- name: React Bits
  url: https://reactbits.dev/
  type: implementation
  category: frontend
  authority: community
  last_verified: 2026-09-01
  status: active
  use_when:
    - sourcing reusable creative React components, interactions, and visual effects
    - researching animated lists, cards, navigation, text, and feedback patterns
    - comparing Tailwind or vanilla CSS implementations before adapting
  avoid_when:
    - Vue/Svelte targets
    - needing framework-agnostic primitives
  search_queries:
    - "react bits component"
    - "react bits animation"
    - "react bits snippet"

- name: Hover
  url: https://www.hover.dev/
  type: implementation
  category: frontend
  authority: community
  last_verified: 2026-09-01
  status: active
  use_when:
    - sourcing React and Tailwind components, sections, and interaction patterns
    - researching hover, navigation, tabs, cards, modals, loaders, and notifications
    - comparing Motion, JavaScript, and keyframe-based implementations
  avoid_when:
