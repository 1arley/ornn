- name: Animate UI
  url: https://animate-ui.com/
  type: implementation
  category: frontend
  authority: community
  last_verified: 2026-09-01
  status: active
  use_when:
    - sourcing open-code React primitives, components, and icons powered by Motion
    - researching accessible animated behavior compatible with Tailwind and shadcn registries
    - comparing concrete transition and motion patterns before React implementation
  avoid_when:
    - needing animation principles over code
    - when reduced-motion accessibility is the primary concern
  search_queries:
    - "animate ui component animation"
    - "animate ui transition examples"
    - "animate ui motion implementation"

