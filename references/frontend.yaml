- name: Headless UI
  url: https://headlessui.com/
  type: implementation
  category: frontend
  authority: vendor
  last_verified: 2026-09-01
  status: active
  use_when:
    - implementing accessible, unstyled React/Vue primitives
    - building accessible tabs, menus, dialogs, popovers, listboxes, disclosures, and forms
    - adding behaviour without committed visuals to style via a design system
  avoid_when:
    - needing styled/visual components
    - wanting ready copy-paste visuals (use Magic UI/Aceternity)
  search_queries:
    - "headless ui react"
    - "headless ui dialog"
    - "headless ui menu accessible"

